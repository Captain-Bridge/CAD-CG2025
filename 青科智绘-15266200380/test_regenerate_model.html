<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型重新生成功能测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 0 auto; }
        button { margin: 10px; padding: 10px 20px; }
        .test-result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>模型重新生成功能测试</h1>
        <p>这个页面用于测试模型重新生成功能是否正常工作。</p>
        
        <button onclick="testOriginalGeneration()">测试原始模型生成</button>
        <button onclick="testParameterUpdate()">测试参数更新</button>
        <button onclick="testRegeneration()">测试模型重新生成</button>
        
        <div id="results"></div>
    </div>

    <script>
        function logResult(message, type = 'success') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            resultDiv.innerHTML = `<strong>${icon}</strong> ${message}`;
            resultsDiv.appendChild(resultDiv);
            console.log(message);
        }
        
        function testOriginalGeneration() {
            try {
                // 模拟原始模型生成
                const mockParsedResult = {
                    shape: '长方体',
                    dimensions: {
                        '长': { normalizedValue: 100, value: 100, unit: 'mm' },
                        '宽': { normalizedValue: 50, value: 50, unit: 'mm' },
                        '高': { normalizedValue: 30, value: 30, unit: 'mm' }
                    },
                    features: []
                };
                
                // 模拟GeometryGenerator.generate()
                const mockGeneratedModel = {
                    shape: '长方体',
                    geometry: new THREE.BoxGeometry(100, 30, 50),
                    dimensions: mockParsedResult.dimensions,
                    features: mockParsedResult.features,
                    generationTime: Date.now()
                };
                
                logResult('原始模型生成测试成功');
                logResult(`形状: ${mockGeneratedModel.shape}`, 'info');
                logResult(`参数: 长${mockGeneratedModel.dimensions['长'].normalizedValue}mm, 宽${mockGeneratedModel.dimensions['宽'].normalizedValue}mm, 高${mockGeneratedModel.dimensions['高'].normalizedValue}mm`, 'info');
                
            } catch (error) {
                logResult(`原始模型生成测试失败: ${error.message}`, 'error');
            }
        }
        
        function testParameterUpdate() {
            try {
                // 模拟参数更新
                const mockDimensions = {
                    '长': { normalizedValue: 100, value: 100, unit: 'mm' },
                    '宽': { normalizedValue: 50, value: 50, unit: 'mm' },
                    '高': { normalizedValue: 30, value: 30, unit: 'mm' }
                };
                
                // 模拟编辑后的参数
                const editedParams = {
                    '长': 150,
                    '宽': 80,
                    '高': 60
                };
                
                // 更新参数
                Object.entries(editedParams).forEach(([key, value]) => {
                    if (mockDimensions[key]) {
                        mockDimensions[key].normalizedValue = value;
                    }
                });
                
                logResult('参数更新测试成功');
                logResult(`更新前: 长100mm, 宽50mm, 高30mm`, 'info');
                logResult(`更新后: 长${mockDimensions['长'].normalizedValue}mm, 宽${mockDimensions['宽'].normalizedValue}mm, 高${mockDimensions['高'].normalizedValue}mm`, 'info');
                
            } catch (error) {
                logResult(`参数更新测试失败: ${error.message}`, 'error');
            }
        }
        
        function testRegeneration() {
            try {
                // 模拟重新生成过程
                const mockGeneratedModel = {
                    shape: '长方体',
                    dimensions: {
                        '长': { normalizedValue: 150, value: 150, unit: 'mm' },
                        '宽': { normalizedValue: 80, value: 80, unit: 'mm' },
                        '高': { normalizedValue: 60, value: 60, unit: 'mm' }
                    },
                    features: []
                };
                
                // 模拟重新生成
                const updatedParsedResult = {
                    shape: mockGeneratedModel.shape,
                    dimensions: mockGeneratedModel.dimensions,
                    features: mockGeneratedModel.features
                };
                
                // 模拟GeometryGenerator.generate()
                const newGeometry = new THREE.BoxGeometry(
                    updatedParsedResult.dimensions['长'].normalizedValue,
                    updatedParsedResult.dimensions['高'].normalizedValue,
                    updatedParsedResult.dimensions['宽'].normalizedValue
                );
                
                const newGeneratedModel = {
                    shape: updatedParsedResult.shape,
                    geometry: newGeometry,
                    dimensions: updatedParsedResult.dimensions,
                    features: updatedParsedResult.features
                };
                
                logResult('模型重新生成测试成功');
                logResult(`新几何体类型: ${newGeneratedModel.geometry.constructor.name}`, 'info');
                logResult(`新几何体参数: ${newGeneratedModel.dimensions['长'].normalizedValue} x ${newGeneratedModel.dimensions['高'].normalizedValue} x ${newGeneratedModel.dimensions['宽'].normalizedValue}`, 'info');
                
            } catch (error) {
                logResult(`模型重新生成测试失败: ${error.message}`, 'error');
            }
        }
        
        // 页面加载时自动运行所有测试
        window.onload = function() {
            logResult('开始运行模型重新生成功能测试...', 'info');
            setTimeout(() => {
                testOriginalGeneration();
                setTimeout(() => {
                    testParameterUpdate();
                    setTimeout(() => {
                        testRegeneration();
                        logResult('所有测试完成！', 'info');
                    }, 500);
                }, 500);
            }, 500);
        };
    </script>
</body>
</html>
