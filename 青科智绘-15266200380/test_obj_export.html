<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJ导出测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 0 auto; }
        button { margin: 10px; padding: 10px 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OBJ导出功能测试</h1>
        <p>这个页面用于测试OBJ导出功能，确保导出的文件格式正确。</p>
        
        <button onclick="createTestCube()">创建测试立方体</button>
        <button onclick="createTestSphere()">创建测试球体</button>
        <button onclick="exportOBJ()">导出OBJ</button>
        <button onclick="showGeometryInfo()">显示几何体信息</button>
        
        <div id="output"></div>
    </div>

    <script>
        let currentMesh = null;
        
        function createTestCube() {
            const geometry = new THREE.BoxGeometry(10, 10, 10);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            currentMesh = new THREE.Mesh(geometry, material);
            
            document.getElementById('output').innerHTML = '<p>✅ 创建了测试立方体 (10x10x10)</p>';
        }
        
        function createTestSphere() {
            const geometry = new THREE.SphereGeometry(5, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            currentMesh = new THREE.Mesh(geometry, material);
            
            document.getElementById('output').innerHTML = '<p>✅ 创建了测试球体 (半径5, 32段)</p>';
        }
        
        function formatNumber(num) {
            if (num === 0) return '0';
            if (Math.abs(num) < 0.000001) return '0';
            if (Math.abs(num) > 999999) {
                return num.toExponential(6);
            }
            return parseFloat(num.toFixed(6)).toString();
        }
        
        function exportOBJ() {
            if (!currentMesh) {
                alert('请先创建一个测试模型');
                return;
            }
            
            try {
                const geometry = currentMesh.geometry;
                const vertices = geometry.attributes.position.array;
                const indices = geometry.index ? geometry.index.array : null;
                const normals = geometry.attributes.normal ? geometry.attributes.normal.array : null;
                
                // 验证几何体
                if (!vertices || vertices.length === 0) {
                    throw new Error('没有顶点数据');
                }
                
                if (vertices.length % 3 !== 0) {
                    throw new Error('顶点数据格式错误');
                }
                
                const vertexCount = vertices.length / 3;
                
                let objContent = '# Generated by OBJ Export Test\n';
                objContent += `# Vertices: ${vertexCount}\n`;
                objContent += `# Faces: ${indices ? indices.length / 3 : vertices.length / 9}\n\n`;
                
                // 输出顶点
                for (let i = 0; i < vertices.length; i += 3) {
                    const x = formatNumber(vertices[i]);
                    const y = formatNumber(vertices[i + 1]);
                    const z = formatNumber(vertices[i + 2]);
                    
                    if (isNaN(x) || isNaN(y) || isNaN(z) || 
                        !isFinite(x) || !isFinite(y) || !isFinite(z)) {
                        console.warn(`跳过无效顶点 ${i/3}: ${x}, ${y}, ${z}`);
                        continue;
                    }
                    
                    objContent += `v ${x} ${y} ${z}\n`;
                }
                
                // 输出法向量
                if (normals && normals.length > 0) {
                    objContent += '\n';
                    for (let i = 0; i < normals.length; i += 3) {
                        const nx = formatNumber(normals[i]);
                        const ny = formatNumber(normals[i + 1]);
                        const nz = formatNumber(normals[i + 2]);
                        
                        if (isNaN(nx) || isNaN(ny) || isNaN(nz) || 
                            !isFinite(nx) || !isFinite(ny) || !isFinite(nz)) {
                            continue;
                        }
                        
                        objContent += `vn ${nx} ${ny} ${nz}\n`;
                    }
                }
                
                objContent += '\n';
                
                // 输出面
                if (indices) {
                    for (let i = 0; i < indices.length; i += 3) {
                        const v1 = indices[i] + 1;
                        const v2 = indices[i + 1] + 1;
                        const v3 = indices[i + 2] + 1;
                        
                        if (v1 > vertexCount || v2 > vertexCount || v3 > vertexCount) {
                            console.warn(`跳过无效面索引: ${v1}, ${v2}, ${v3}`);
                            continue;
                        }
                        
                        if (normals) {
                            objContent += `f ${v1}//${v1} ${v2}//${v2} ${v3}//${v3}\n`;
                        } else {
                            objContent += `f ${v1} ${v2} ${v3}\n`;
                        }
                    }
                } else {
                    const faceCount = Math.floor(vertices.length / 9);
                    for (let faceIndex = 0; faceIndex < faceCount; faceIndex++) {
                        const baseIndex = faceIndex * 9;
                        const v1 = Math.floor(baseIndex / 3) + 1;
                        const v2 = Math.floor((baseIndex + 3) / 3) + 1;
                        const v3 = Math.floor((baseIndex + 6) / 3) + 1;
                        
                        if (v1 > vertexCount || v2 > vertexCount || v3 > vertexCount) {
                            console.warn(`跳过无效面索引: ${v1}, ${v2}, ${v3}`);
                            continue;
                        }
                        
                        if (normals) {
                            objContent += `f ${v1}//${v1} ${v2}//${v2} ${v3}//${v3}\n`;
                        } else {
                            objContent += `f ${v1} ${v2} ${v3}\n`;
                        }
                    }
                }
                
                // 下载文件
                const blob = new Blob([objContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `test_model_${Date.now()}.obj`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                // 显示文件内容预览
                const preview = objContent.split('\n').slice(0, 20).join('\n');
                document.getElementById('output').innerHTML = `
                    <p>✅ OBJ文件导出成功！</p>
                    <h3>文件内容预览（前20行）：</h3>
                    <pre>${preview}${objContent.split('\n').length > 20 ? '\n...' : ''}</pre>
                `;
                
            } catch (error) {
                console.error('OBJ导出失败:', error);
                document.getElementById('output').innerHTML = `<p style="color: red;">❌ OBJ导出失败: ${error.message}</p>`;
            }
        }
        
        function showGeometryInfo() {
            if (!currentMesh) {
                alert('请先创建一个测试模型');
                return;
            }
            
            const geometry = currentMesh.geometry;
            const vertices = geometry.attributes.position.array;
            const indices = geometry.index ? geometry.index.array : null;
            const normals = geometry.attributes.normal ? geometry.attributes.normal.array : null;
            
            let info = `几何体信息:\n`;
            info += `顶点数量: ${vertices.length / 3}\n`;
            info += `面数量: ${indices ? indices.length / 3 : vertices.length / 9}\n`;
            info += `法向量: ${normals ? '有' : '无'}\n\n`;
            
            // 检查数值问题
            let hasNaN = false;
            let hasInfinity = false;
            for (let i = 0; i < vertices.length; i++) {
                if (isNaN(vertices[i])) hasNaN = true;
                if (!isFinite(vertices[i])) hasInfinity = true;
            }
            
            info += `数值检查:\n`;
            info += `  包含NaN: ${hasNaN ? '是' : '否'}\n`;
            info += `  包含Infinity: ${hasInfinity ? '是' : '否'}\n`;
            
            alert(info);
        }
    </script>
</body>
</html>
